<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>啟德機場抵港班機 · Kai Tak Aircraft Arrivals</title>

    <!-- Fonts: IBM Plex Mono (drum cells), TW-Kai (self-hosted kaiti, board.css @font-face), Oswald (header). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&family=Oswald:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- board.css supplies the shared Kai Tak skin; arrivals-board.css overrides
         only the column grid for the arrivals layout. -->
    <link rel="stylesheet" href="board.css" />
    <link rel="stylesheet" href="arrivals-board.css" />
  </head>
  <body>
    <a class="page-nav" href="index.html">&larr; departures 離港</a>
    <a class="page-nav left" href="about.html">&#9432; about 關於</a>
    <div class="stage">
      <div class="frame" id="frame">
        <!-- Bilingual header — printed in black on the yellow frame, mirroring
             the departures board. -->
        <div class="header">
          <div class="title-en">Aircraft Arrivals</div>
          <div class="title-zh">抵港班機</div>
        </div>

        <div class="board kaitak arrivals">
          <!-- Bilingual column labels (aligned to the same grid as the rows). -->
          <div class="klabels">
            <div class="klabel" style="grid-column: 2">
              <span class="en">flight</span><span class="zh">班機</span>
            </div>
            <div class="klabel" style="grid-column: 3 / span 2">
              <span class="en">from</span><span class="zh">來自</span>
            </div>
            <div class="klabel" style="grid-column: 5">
              <span class="en">scheduled</span><span class="zh">預定時間</span>
            </div>
            <div class="klabel" style="grid-column: 6">
              <span class="en">baggage</span><span class="zh">行李帶</span>
            </div>
            <div class="klabel" style="grid-column: 7">
              <span class="en">status</span><span class="zh">情況</span>
            </div>
            <div class="klabel" style="grid-column: 8">
              <span class="en">arrival</span><span class="zh">抵港時間</span>
            </div>
          </div>

          <!-- Flight rows are injected here by arrivals-board.js. -->
          <div id="rows" class="rows"></div>

          <!-- Subtle stale-data indicator; shown only while .board has
               .is-stale (toggled by arrivals-data.js when the worker serves a
               cached copy because the HKIA upstream was unreachable). -->
          <div class="stale-indicator" aria-hidden="true">· stale ·</div>
        </div>
      </div>
    </div>

    <script src="flap.js"></script>
    <script src="arrivals-board.js"></script>
    <script src="arrivals-data.js"></script>
    <!-- Space / arrow keys / A / D flip between the departures and arrivals boards. -->
    <script>
      addEventListener('keydown', function (e) {
        if ([' ', 'ArrowLeft', 'ArrowRight', 'a', 'd'].indexOf(e.key) >= 0) {
          location.href = 'index.html';
        }
      });
    </script>
  </body>
</html>
