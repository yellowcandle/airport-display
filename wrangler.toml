name = "airport-display"
main = "worker.js"
compatibility_date = "2024-11-01"

# Cloudflare Workers Static Assets (modern [assets] binding).
# Serves everything in ./public as static files; the Worker script
# (worker.js) handles dynamic routes such as /api/departures.
[assets]
directory = "./public"
binding = "ASSETS"
# Fall through to the Worker for non-asset requests so /api/* reaches our fetch handler.
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
